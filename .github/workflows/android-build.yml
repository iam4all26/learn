name: Fast Android CI

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      build_release:
        description: 'Build .AAB for Play Store?'
        required: true
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        cache: true
        cache-key: 'flutter-:os:-:channel:-:version:-:arch:-:hash:'

    - name: Generate Native Android Scaffolding
      run: flutter create --platforms=android --org com.kainuwa .

    - name: Fix Package Name for Firebase
      run: |
        sed -i 's/namespace "com.kainuwa.kainuwa_academy"/namespace "com.kainuwa.academy"/g' android/app/build.gradle
        sed -i 's/applicationId "com.kainuwa.kainuwa_academy"/applicationId "com.kainuwa.academy"/g' android/app/build.gradle

    - name: Activate Google Services & Strip Unused Permissions
      run: |
        sed -i '/dependencies {/a \        classpath "com.google.gms:google-services:4.4.0"' android/build.gradle
        sed -i '/apply plugin: "com.android.application"/a apply plugin: "com.google.gms.google-services"' android/app/build.gradle
        
        # Add tools namespace and force remove the media playback permission
        sed -i 's/<manifest xmlns:android="http:\/\/schemas.android.com\/apk\/res\/android"/<manifest xmlns:android="http:\/\/schemas.android.com\/apk\/res\/android" xmlns:tools="http:\/\/schemas.android.com\/tools"/g' android/app/src/main/AndroidManifest.xml
        sed -i '/<application/i \    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" tools:node="remove" />' android/app/src/main/AndroidManifest.xml
        
        sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET" />' android/app/src/main/AndroidManifest.xml
        sed -i 's/android:label="kainuwa_academy"/android:label="Kainuwa Academy"/g' android/app/src/main/AndroidManifest.xml

    - name: Add Permissions and Notification Icon
      run: |
        MANIFEST=android/app/src/main/AndroidManifest.xml
        # Notification icon and colour are created right here, so no image files are needed in the repo
        RES=android/app/src/main/res
        mkdir -p $RES/drawable-xxhdpi $RES/values
        echo "" | base64 -d > $RES/drawable-xxhdpi/ic_stat_kainuwa.png
        printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="kainuwa_notification">#7351FF</color>\n</resources>\n' > $RES/values/kainuwa_colors.xml
        # Photos / files: old phones (Android 12 and below) and new phones (Android 13+)
        sed -i '/<manifest/a \    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />' $MANIFEST
        sed -i '/<manifest/a \    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />' $MANIFEST
        # Push notifications on Android 13+
        sed -i '/<manifest/a \    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />' $MANIFEST
        # Kainuwa icon and colour for notifications (instead of the grey box)
        sed -i '/<\/application>/i \        <meta-data android:name="com.google.firebase.messaging.default_notification_icon" android:resource="@drawable/ic_stat_kainuwa" />' $MANIFEST
        sed -i '/<\/application>/i \        <meta-data android:name="com.google.firebase.messaging.default_notification_color" android:resource="@color/kainuwa_notification" />' $MANIFEST

    - name: Install dependencies
      run: flutter pub get

    - name: Generate Icons and Splash
      run: |
        flutter pub run flutter_launcher_icons
        flutter pub run flutter_native_splash:create

    - name: Decode Keystore from Secrets
      env:
        ENCODED_KEYSTORE: ${{ secrets.KAIDA_KEY_JKS_BASE64 }}
      run: |
        echo "$ENCODED_KEYSTORE" | base64 --decode --ignore-garbage > kaida_upload_key.jks

    - name: Build Fast APK (Always runs)
      run: flutter build apk --release --split-per-abi

    - name: Sign 64-bit APK (For Direct Download)
      env:
        STORE_PASSWORD: ${{ secrets.KAIDA_STORE_PASSWORD }}
        KEY_PASSWORD: ${{ secrets.KAIDA_KEY_PASSWORD }}
      run: |
        BUILD_TOOLS=$(ls $ANDROID_SDK_ROOT/build-tools | sort -n | tail -1)
        $ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS/apksigner sign --ks kaida_upload_key.jks --ks-pass pass:$STORE_PASSWORD --key-pass pass:$KEY_PASSWORD build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

    - name: Upload 64-bit APK
      uses: actions/upload-artifact@v4
      with:
        name: Kaida-Learn-Optimized-APK
        path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

    - name: Build App Bundle
      if: ${{ github.event.inputs.build_release == 'true' }}
      run: flutter build appbundle --release

    - name: Strip Debug Signature and Sign Play Store Bundle
      if: ${{ github.event.inputs.build_release == 'true' }}
      env:
        STORE_PASSWORD: ${{ secrets.KAIDA_STORE_PASSWORD }}
        KEY_PASSWORD: ${{ secrets.KAIDA_KEY_PASSWORD }}
      run: |
        zip -d build/app/outputs/bundle/release/app-release.aab "META-INF/*.RSA" "META-INF/*.SF" "META-INF/*.MF" || true
        jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore kaida_upload_key.jks -storepass $STORE_PASSWORD -keypass $KEY_PASSWORD build/app/outputs/bundle/release/app-release.aab kaida_upload_alias

    - name: Upload Play Store Bundle
      if: ${{ github.event.inputs.build_release == 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: Kaida-Learn-PlayStore-AAB
        path: build/app/outputs/bundle/release/app-release.aab